[tool.poetry]
name = "ml"
version = "0.1.0"
description = ""
authors = ["国土交通省総合政策局情報政策課"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
geopandas = "1.0.1"
lightgbm = "4.4.0"
matplotlib = "3.8.4"
numpy = "1.26.4"
pandas = "2.2.2"
shapely = "2.0.4"
fiona = "1.9.6"
pyogrio = "0.10.0"
pyproj = "3.6.1"
rtree = "1.3.0"
geopy = "2.4.1"
seaborn = "0.13.2"
tqdm = "4.66.4"
chardet = "5.2.0"
scikit-learn = "1.5.0"
joblib = ">=1.3.0"
scipy = "1.14.0"
requests = "2.31.0"
python-dotenv = "1.0.1"
optuna = "3.6.1"
memory-profiler = "0.61.0"
imbalanced-learn = "0.12.4"
polars = "1.35.2"
pyarrow = "18.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pyinstaller = { version = "6.11.0", python = ">=3.11,<3.14" }
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
pythonpath = ["src", "src/E001_DataMatching", "src/E002_Classification", "src/E003_Summarization", "async_tasks", "tests"]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = [
    "src/preprocessing",
    "src/E001_DataMatching",
    "src/E002_Classification",
    "src/E003_Summarization",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
