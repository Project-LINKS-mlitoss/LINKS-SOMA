name: Lint

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/lint.yml"
  push:
    branches:
      - develop
    paths:
      - "app/**"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # push イベントでは github.event.pull_request が null となり draft==false 単独だと false 評価されてしまうため event_name で先行判定する
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm ci

      - name: Run lint
        run: npm run lint
